# Go formatting and static analysis configuration.

version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    rules:
      # Image arguments intentionally accept any path readable by the CLI user.
      - path: ^(apa102|nrzled|ssd1306)/main\.go$
        linters: [gosec]
        text: '^G703:'
        source: 'os.Stat\(name\)'
      # The server supports plain HTTP; HttpOnly and Strict SameSite protect its cookie.
      - path: ^periph-web/web\.go$
        linters: [gosec]
        text: '^G124:'
        source: 'c := http.Cookie'
      # Debug handlers supply fixed local asset names, not client URL paths.
      - path: ^periph-web/static_debug\.go$
        linters: [gosec]
        text: '^G304:'
        source: 'os.ReadFile\(path\)'
      # Token bytes are a server-generated timestamp/MAC in hex and URL-safe base64.
      - path: ^periph-web/web_handlers\.go$
        linters: [gosec]
        text: '^G705:'
        source: 'w.Write\(\[\]byte\(t\)\)'
      # The standalone gosec CI command scanned production sources only.
      - path: _test\.go$
        linters: [gosec]
  settings:
    gosec:
      excludes: [G115]
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF*", "-SA1019"]
    govet:
      enable:
        - shadow
      disable:
        - unsafeptr
        # Newer stdlib inlining suggestions cannot target the minimum Go version.
        - inline
formatters:
  exclusions:
    generated: lax
  enable:
    - gofmt
    - goimports
